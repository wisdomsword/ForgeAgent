workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify

variables:
  GIT_DEPTH: "0"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: "uv-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv

offline-verification:
  stage: verify
  image: node:22.22.0-bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python3-venv git ca-certificates
    - python3 -m pip install --break-system-packages --no-cache-dir uv==0.11.1
    - npm install --global @fission-ai/openspec@1.4.1
    - uv sync --locked
  script:
    - mkdir -p artifacts/ci/golden dist
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -q
    - uv run python -m tests.golden.runner --output-dir artifacts/ci/golden
    - openspec validate --all --strict
    - uv build --out-dir dist
  artifacts:
    when: always
    paths:
      - artifacts/ci/golden/
      - dist/

linux-docker-container:
  stage: verify
  image: docker:29.2.1-cli
  services:
    - name: docker:29.2.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TMPDIR: "$CI_PROJECT_DIR/.tmp"
  tags:
    - docker-privileged
  before_script:
    - apk add --no-cache python3 py3-pip git su-exec
    - python3 -m pip install --break-system-packages --no-cache-dir uv==0.11.1
    - uv sync --locked
    - mkdir -p artifacts/ci "$TMPDIR"
    - adduser -D -u 1000 forgeagent
    - chown -R forgeagent:forgeagent "$CI_PROJECT_DIR"
  script:
    - mkdir -p artifacts/ci "$TMPDIR"
    - docker info
    - docker pull python:3.11-slim
    - docker image inspect python:3.11-slim
    - su-exec forgeagent uv run pytest -q tests/test_container_backend.py -m container_integration --junitxml=artifacts/ci/container-junit.xml
    - >-
      python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("artifacts/ci/container-junit.xml").getroot(); suites=[root] if root.tag=="testsuite" else root.findall("testsuite"); tests=sum(int(s.attrib.get("tests", 0)) for s in suites); failures=sum(int(s.attrib.get("failures", 0)) for s in suites); errors=sum(int(s.attrib.get("errors", 0)) for s in suites); skipped=sum(int(s.attrib.get("skipped", 0)) for s in suites); counts={"tests": tests, "failures": failures, "errors": errors, "skipped": skipped}; assert tests == 10, counts; assert skipped == 0, counts; assert failures == 0, counts; assert errors == 0, counts'
    - su-exec forgeagent uv build --wheel --out-dir artifacts/ci/dist
    - >-
      set -- artifacts/ci/dist/forgeagent-0.1.0-*.whl;
      test "$#" -eq 1 || exit 1;
      test -f "$1" || exit 1;
      wheel="$1";
      su-exec forgeagent mkdir -p "$CI_PROJECT_DIR/.tmp/rc-home" "$CI_PROJECT_DIR/.tmp/rc-tmp" "$CI_PROJECT_DIR/.tmp/rc-work";
      docker run --rm
      --user 1000:1000
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR/.tmp/rc-work"
      -e HOME="$CI_PROJECT_DIR/.tmp/rc-home"
      -e TMPDIR="$CI_PROJECT_DIR/.tmp/rc-tmp"
      python:3.11-slim
      sh -c 'if python -m pip install --disable-pip-version-check --no-cache-dir --user "$1"; then python "$2" --wheel "$1" --output "$3" --python python; else python -c "$4" "$1" "$3"; exit 1; fi'
      forgeagent
      "$CI_PROJECT_DIR/$wheel"
      "$CI_PROJECT_DIR/scripts/m28_release_candidate_smoke.py"
      "$CI_PROJECT_DIR/artifacts/ci/rc-smoke.json"
      'import hashlib,json,os,platform,sys;wheel,output=sys.argv[1:];checks={"clean-wheel":"failed","cli":"not-run","http":"not-run","single":"not-run","duo":"not-run","triad":"not-run"};report={"schema":"forgeagent.release-candidate-smoke/v1","version":"0.1.0","python":platform.python_version(),"wheel_sha256":hashlib.sha256(open(wheel,"rb").read()).hexdigest(),"passed":False,"checks":checks};temp=output+".tmp";open(temp,"w",encoding="utf-8").write(json.dumps(report,sort_keys=True,separators=(",",":"))+"\n");os.replace(temp,output)'
    - >-
      python3 -c 'import json; r=json.load(open("artifacts/ci/rc-smoke.json", encoding="utf-8")); fields={"schema", "version", "python", "wheel_sha256", "passed", "checks"}; names={"clean-wheel", "cli", "http", "single", "duo", "triad"}; assert set(r) == fields, r; assert r["schema"] == "forgeagent.release-candidate-smoke/v1", r; assert r["version"] == "0.1.0", r; assert r["passed"] is True, r; assert set(r["checks"]) == names, r; assert all(r["checks"][name] == "passed" for name in names), r'
  artifacts:
    when: always
    paths:
      - artifacts/ci/container-junit.xml
      - artifacts/ci/rc-smoke.json
    reports:
      junit: artifacts/ci/container-junit.xml
