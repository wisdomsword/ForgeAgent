name: Verify
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-python@v5.6.0
      with:
        python-version: 3.11.15
    - name: Install uv
      run: |-
        mkdir -p .tmp
        python -m pip install --no-cache-dir uv==0.11.1
        uv sync --locked
    - uses: actions/setup-node@v4.4.0
      with:
        node-version: 22.22.0
    - name: Run offline gates
      run: |-
        npm install --global @fission-ai/openspec@1.13.1
        mkdir -p artifacts/ci/golden dist
        uv run ruff check .
        uv run ruff format --check .
        uv run pytest -q
        uv run python -m tests.golden.runner --output-dir artifacts/ci/golden
        openspec validate --all --strict
        uv build --out-dir dist
    - uses: actions/upload-artifact@v4.6.2
      if: always()
      with:
        name: offline-verification
        path: |-
          artifacts/ci/golden/
          dist/
        if-no-files-found: error
  linux-docker-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-python@v5.6.0
      with:
        python-version: 3.11.15
    - name: Install uv
      run: |-
        mkdir -p .tmp
        python -m pip install --no-cache-dir uv==0.11.1
        uv sync --locked
    - name: Run required Linux Docker gate
      run: |-
        test "$(id -u)" -ne 0
        mkdir -p artifacts/ci "$TMPDIR"
        docker info
        docker pull python:3.11-slim
        docker image inspect python:3.11-slim
        uv run pytest -q tests/test_container_backend.py -m container_integration --junitxml=artifacts/ci/container-junit.xml
        python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("artifacts/ci/container-junit.xml").getroot(); suites=[root] if root.tag=="testsuite" else root.findall("testsuite"); tests=sum(int(s.attrib.get("tests", 0)) for s in suites); failures=sum(int(s.attrib.get("failures", 0)) for s in suites); errors=sum(int(s.attrib.get("errors", 0)) for s in suites); skipped=sum(int(s.attrib.get("skipped", 0)) for s in suites); counts={"tests": tests, "failures": failures, "errors": errors, "skipped": skipped}; assert tests == 10, counts; assert skipped == 0, counts; assert failures == 0, counts; assert errors == 0, counts'
        uv build --wheel --out-dir artifacts/ci/dist
        set -- artifacts/ci/dist/forgeagent-0.1.0-*.whl; test "$#" -eq 1 || exit 1; test -f "$1" || exit 1; wheel="$1"; mkdir -p "$GITHUB_WORKSPACE/.tmp/rc-home" "$GITHUB_WORKSPACE/.tmp/rc-tmp" "$GITHUB_WORKSPACE/.tmp/rc-work"; docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/.tmp/rc-work" -e HOME="$GITHUB_WORKSPACE/.tmp/rc-home" -e TMPDIR="$GITHUB_WORKSPACE/.tmp/rc-tmp" python:3.11-slim sh -c 'if python -m pip install --disable-pip-version-check --no-cache-dir --user "$1"; then python "$2" --wheel "$1" --output "$3" --python python; else python -c "$4" "$1" "$3"; exit 1; fi' forgeagent "$GITHUB_WORKSPACE/$wheel" "$GITHUB_WORKSPACE/scripts/m28_release_candidate_smoke.py" "$GITHUB_WORKSPACE/artifacts/ci/rc-smoke.json" 'import hashlib,json,os,platform,sys;wheel,output=sys.argv[1:];checks={"clean-wheel":"failed","cli":"not-run","http":"not-run","single":"not-run","duo":"not-run","triad":"not-run"};report={"schema":"forgeagent.release-candidate-smoke/v1","version":"0.1.0","python":platform.python_version(),"wheel_sha256":hashlib.sha256(open(wheel,"rb").read()).hexdigest(),"passed":False,"checks":checks};temp=output+".tmp";open(temp,"w",encoding="utf-8").write(json.dumps(report,sort_keys=True,separators=(",",":"))+"\n");os.replace(temp,output)'
        python3 -c 'import json; r=json.load(open("artifacts/ci/rc-smoke.json", encoding="utf-8")); fields={"schema", "version", "python", "wheel_sha256", "passed", "checks"}; names={"clean-wheel", "cli", "http", "single", "duo", "triad"}; assert set(r) == fields, r; assert r["schema"] == "forgeagent.release-candidate-smoke/v1", r; assert r["version"] == "0.1.0", r; assert r["passed"] is True, r; assert set(r["checks"]) == names, r; assert all(r["checks"][name] == "passed" for name in names), r'
    - uses: actions/upload-artifact@v4.6.2
      if: always()
      with:
        name: linux-docker-evidence
        path: |-
          artifacts/ci/container-junit.xml
          artifacts/ci/rc-smoke.json
        if-no-files-found: error
