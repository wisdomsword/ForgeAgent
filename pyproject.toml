[project]
name = "forgeagent"
version = "0.1.0"
description = "Lightweight code-as-action agent: the LLM writes Python programs and completes tasks by executing them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "anthropic>=0.40,<1",
    "jinja2>=3.1,<4",
    "rich>=13.0,<16",
    "pyyaml>=6.0,<7",
    "openai>=2.24,<3",
    "mcp>=1.30.0,<2",
    "prompt-toolkit>=3.0,<4",
]

[project.scripts]
forgeagent = "forgeagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
build-constraint-dependencies = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeagent"]
artifacts = ["src/forgeagent/res/*.yaml", "src/forgeagent/res/prompts/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/forgeagent",
    "/pyproject.toml",
    "/README.md",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# resource/ 是只读参考项目 agent，不属本项目代码，排除在静态检查外
extend-exclude = ["resource"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "container_integration: requires a real container daemon and worker image",
]
