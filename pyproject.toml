[project]
name = "forgeagent"
version = "0.1.0"
description = "Lightweight code-as-action agent: the LLM writes Python programs and completes tasks by executing them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "openai>=2.24,<3",
    "mcp>=1.28.1",
    "prompt-toolkit>=3.0,<4",
]

[project.scripts]
forgeagent = "forgeagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeagent"]
artifacts = ["src/forgeagent/res/*.yaml", "src/forgeagent/res/prompts/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/forgeagent",
    "/pyproject.toml",
    "/README.md",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# resource/ 是只读参考项目 agent，不属本项目代码，排除在静态检查外
extend-exclude = ["resource"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "container_integration: requires a real container daemon and worker image",
]
